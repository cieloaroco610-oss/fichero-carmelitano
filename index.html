<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichero Carmelitano</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#123b63,#176b87);
  color:white;
  padding:35px 20px;
  text-align:center;
}

header h1{
  font-size:42px;
  margin-bottom:10px;
}

header p{
  font-size:18px;
}

nav{
  background:white;
  padding:15px;
  text-align:center;
  box-shadow:0 2px 8px #0002;
  position:sticky;
  top:0;
  z-index:10;
}

nav button{
  border:0;
  background:#176b87;
  color:white;
  padding:10px 16px;
  margin:5px;
  border-radius:20px;
  cursor:pointer;
}

nav button:hover{
  background:#123b63;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.search{
  width:100%;
  padding:15px;
  border:2px solid #d5dce5;
  border-radius:12px;
  font-size:16px;
  margin-bottom:25px;
}

.grades{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.grade{
  background:white;
  padding:25px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 4px 12px #0001;
  cursor:pointer;
  transition:.2s;
}

.grade:hover{
  transform:translateY(-5px);
}

.grade h2{
  color:#176b87;
  margin-bottom:10px;
}

.subjects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
  margin-top:20px;
}

.subject{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 12px #0001;
  cursor:pointer;
}

.subject:hover{
  transform:translateY(-4px);
}

.subject h3{
  color:#176b87;
  margin-bottom:8px;
}

.subject p{
  color:#555;
}

.lesson{
  background:white;
  margin-top:20px;
  padding:25px;
  border-radius:18px;
  box-shadow:0 4px 12px #0001;
}

.lesson h2{
  color:#123b63;
  margin-bottom:15px;
}

.lesson h3{
  color:#176b87;
  margin-top:18px;
  margin-bottom:8px;
}

.lesson ul{
  margin-left:25px;
  line-height:1.8;
}

.lesson p{
  line-height:1.7;
}

.card-img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:14px;
  margin:15px 0;
}

.task{
  background:#eef7fa;
  border-left:5px solid #176b87;
  padding:18px;
  margin-top:15px;
  border-radius:10px;
}

.video{
  display:inline-block;
  background:#d92323;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  text-decoration:none;
  margin-top:10px;
}

.back{
  background:#555;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:15px;
}

footer{
  background:#123b63;
  color:white;
  text-align:center;
  padding:30px;
  margin-top:40px;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  header h1{
    font-size:30px;
  }

  .container{
    padding:15px;
  }
}
</style>
</head>

<body>

<nav>

  <button onclick="mostrarGrados()">📚 Grados</button>
</nav>

<h2 style="margin-bottom:15px;">Selecciona tu grado</h2>

<div class="grades">

<p>Primero de Secundaria</p>
</div>

<div class="grade" onclick="mostrarGrado(2)">

<div class="grade" onclick="mostrarGrado(3)">

<div class="grade" onclick="mostrarGrado(4)">

</div>

<div class="grade" onclick="mostrarGrado(5)">
<h2>5.º</h2>
<p>Quinto de Secundaria</p>
</div>

</div>

</section>

<section id="grado" class="hidden"></section>

<section id="curso" class="hidden"></section>

</div>

/* MOSTRAR GRADOS */

function inicio(){

document.getElementById("inicio").classList.remove("hidden");
document.getElementById("grado").classList.add("hidden");
document.getElementById("curso").classList.add("hidden");

window.scrollTo(0,0);

}

function mostrarGrados(){

inicio();

}


/* MOSTRAR CURSOS DEL GRADO */

function mostrarGrado(grado){

document.getElementById("inicio").classList.add("hidden");
document.getElementById("curso").classList.add("hidden");

let html=`

<button class="back" onclick="inicio()">← Volver</button>

<h2>📚 ${grado}.º de Secundaria</h2>

<p style="margin-top:8px;">
Selecciona un curso para comenzar a aprender.
</p>

<div class="subjects">
`;

cursos.forEach((curso,index)=>{

html+=`

<div class="subject" onclick="mostrarCurso(${grado},${index})">

<h3>${curso.icono} ${curso.nombre}</h3>

<p>
Contenido educativo, explicaciones,
ejercicios, tareas y videos.
</p>

</div>

`;

});

html+=`</div>`;

document.getElementById("grado").innerHTML=html;
document.getElementById("grado").classList.remove("hidden");

window.scrollTo(0,0);

}


/* MOSTRAR CURSO */

function mostrarCurso(grado,index){

let curso=cursos[index];

let lista=temasGrado[grado][curso.nombre];

let html=`

<button class="back" onclick="mostrarGrado(${grado})">
← Volver a ${grado}.º
</button>

<div class="lesson">

<h2>${curso.icono} ${curso.nombre}</h2>

<p>
<strong>${grado}.º de Secundaria</strong>
</p>

<img class="card-img" src="${curso.imagen}">

<h3>📖 ¿Qué aprenderás?</h3>

<p>
En este curso desarrollarás conocimientos,
habilidades y competencias que podrás aplicar
en tus estudios y en situaciones de la vida diaria.
Lee cada tema, observa los ejemplos y realiza
las actividades propuestas.
</p>

<h3>📚 Temas principales</h3>

<ul>
`;

lista.forEach((tema,i)=>{

html+=`<li><strong>${i+1}. ${tema}</strong></li>`;

});

html+=`

</ul>

`;

lista.forEach((tema,i)=>{

html+=`

<div class="task">

<h3>📌 Tema ${i+1}: ${tema}</h3>

<p>
<strong>Explicación:</strong>
Este tema es importante porque permite desarrollar
conocimientos y habilidades para comprender mejor
el mundo que nos rodea. Estudia los conceptos
principales, identifica ejemplos y relaciona lo
aprendido con situaciones de la vida cotidiana.
</p>

<h3>💡 Para recordar</h3>

<p>
Lee atentamente la información, identifica las
ideas principales, toma apuntes y explica con tus
propias palabras lo que aprendiste.
</p>

<h3>✏️ Actividad</h3>

<p>
1. Explica con tus propias palabras qué entendiste
del tema.<br>
2. Escribe tres ideas principales.<br>
3. Busca un ejemplo relacionado con tu comunidad.<br>
4. Realiza un pequeño resumen.<br>
5. Comparte tus respuestas con un compañero.
</p>

<h3>📝 Tarea</h3>

<p>
Investiga más sobre <strong>${tema}</strong> y prepara
una presentación de cinco minutos. Incluye definición,
características, ejemplos e imágenes.
</p>

</div>

`;

});

html+=`

<h3>🎯 Reto final</h3>

<p>
Realiza un pequeño proyecto relacionado con
<strong>${curso.nombre}</strong>. Puedes elaborar
una exposición, afiche, experimento, texto,
problema resuelto, dibujo, video o presentación.
</p>

<h3>🎥 Video educativo</h3>

<p>
Puedes encontrar explicaciones y clases sobre
este curso en YouTube:
</p>

<a class="video"
href="https://www.youtube.com/results?search_query=${encodeURIComponent(curso.nombre+" "+grado+" secundaria Perú")}"

▶ Ver videos educativos
</a>

<h3>🔎 Para investigar más</h3>

<p>
Busca información en libros, bibliotecas digitales,
materiales escolares y fuentes educativas confiables.
Compara la información y escribe tus propias conclusiones.
</p>

/* BUSCADOR */

function buscar(){

let texto=document.getElementById("buscador").value.toLowerCase();

if(texto.length<2){
inicio();
return;
}

let resultados=[];

cursos.forEach((curso,index)=>{

if(curso.nombre.toLowerCase().includes(texto)){

resultados.push({
curso:curso,
index:index
});

}

Object.keys(temasGrado).forEach(grado=>{

let temas=temasGrado[grado][curso.nombre] || [];

temas.forEach(tema=>{

if(tema.toLowerCase().includes(texto)){

resultados.push({
curso:curso,
index:index,
grado:grado,
tema:tema
});

}

});

});

});

let html=`

<h2>🔎 Resultados de búsqueda</h2>

<div class="subjects">

`;

if(resultados.length===0){

html+=`

<div class="lesson">

<h3>😕 No encontramos resultados</h3>

<p>
Prueba buscando otra palabra, por ejemplo:
<strong>matemática, historia, inglés, genética,
ecuaciones o democracia.</strong>
</p>

</div>

`;

}else{

resultados.forEach(r=>{

html+=`

<div class="subject">

<h3>${r.curso.icono} ${r.curso.nombre}</h3>

<p>
${r.grado ? r.grado+".º de Secundaria — "+r.tema : "Curso disponible"}
</p>

<button
style="margin-top:12px;padding:10px;border:0;border-radius:8px;background:#176b87;color:white;cursor:pointer"
onclick="mostrarCurso(${r.grado || 1},${r.index})">

Ver contenido

</button>

</div>

`;

});

}

html+=`</div>`;

document.getElementById("inicio").classList.add("hidden");
document.getElementById("grado").classList.add("hidden");

document.getElementById("curso").innerHTML=html;
document.getElementById("curso").classList.remove("hidden");

}
